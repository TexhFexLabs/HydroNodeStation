<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1120" style="background:white">
<defs>
<style>
  text  { font-family:'Courier New',Courier,monospace; fill:#111; }
  .title{ font-size:15px; font-weight:bold; }
  .comp { font-size:12px; font-weight:bold; }
  .val  { font-size:11px; fill:#444; }
  .pin  { font-size:10px; fill:#222; }
  .net  { font-size:12px; fill:#003399; font-style:italic; font-weight:bold; }
  .note { font-size:10px; fill:#555; }
  line  { stroke:#111; stroke-width:1.8; fill:none; }
  rect.ic   { fill:#eef0ff; stroke:#111; stroke-width:2; }
  rect.res  { fill:#fffbe8; stroke:#666; stroke-width:1.5; }
  path  { fill:none; stroke:#111; stroke-width:1.8; }
  circle.j  { fill:#111; stroke:none; }
  line.gbus { stroke:#111; stroke-width:2.2; }
  line.sep  { stroke:#bbb; stroke-width:1; stroke-dasharray:8,5; }
</style>
</defs>

<!-- ================================================================= -->
<!-- SCHEMATIC 1 — TPS63900: LiPo 2.5–4.2V → 3.3V (Main Rail)       -->
<!-- ================================================================= -->

<text x="460" y="33" text-anchor="middle" class="title">Schematic 1 — TPS63900: LiPo → 3.3V (Main Rail)</text>

<!-- IC Box -->
<rect x="320" y="155" width="195" height="235" class="ic"/>
<text x="417" y="278" text-anchor="middle" class="comp" font-size="14">TPS63900</text>

<!-- IC pin labels (inside) -->
<text x="328" y="200" class="pin">VIN</text>
<text x="328" y="257" class="pin">EN</text>
<text x="366" y="167" text-anchor="middle" class="pin">L1</text>
<text x="453" y="167" text-anchor="middle" class="pin">L2</text>
<text x="506" y="200" text-anchor="end" class="pin">VOUT</text>
<text x="506" y="300" text-anchor="end" class="pin">FB</text>
<text x="409" y="375" text-anchor="middle" class="pin">GND</text>

<!-- ── Pin stubs ── -->
<!-- VIN: left edge y=195 -->
<line x1="320" y1="195" x2="175" y2="195"/>
<!-- EN: left edge y=251, tied up to VIN wire -->
<line x1="320" y1="251" x2="235" y2="251"/>
<line x1="235" y1="251" x2="235" y2="195"/>
<circle cx="235" cy="195" r="4" class="j"/>
<!-- L1: top edge x=370 -->
<line x1="370" y1="155" x2="370" y2="85"/>
<!-- L2: top edge x=453 -->
<line x1="453" y1="155" x2="453" y2="85"/>
<!-- VOUT: right edge y=195 -->
<line x1="515" y1="195" x2="710" y2="195"/>
<!-- FB: right edge y=295 -->
<line x1="515" y1="295" x2="645" y2="295"/>
<!-- GND: bottom edge -->
<line x1="415" y1="390" x2="415" y2="465"/>

<!-- ── Inductor L 2.2µH (4 bumps upward) ── -->
<path d="M 370,85 A 10,10 0 0 0 390,85 A 10,10 0 0 0 411,85 A 10,10 0 0 0 432,85 A 10,10 0 0 0 453,85"/>
<text x="411" y="57"  text-anchor="middle" class="comp">L</text>
<text x="411" y="70"  text-anchor="middle" class="val">2.2µH / 1A</text>

<!-- ── C1 10µF (input cap, at x=175) ── -->
<line x1="175" y1="195" x2="175" y2="345"/>
<line x1="150" y1="350" x2="200" y2="350"/>
<line x1="150" y1="361" x2="200" y2="361"/>
<line x1="175" y1="361" x2="175" y2="465"/>
<text x="213" y="350" class="comp">C1</text>
<text x="213" y="365" class="val">10µF X7R</text>
<circle cx="175" cy="195" r="4" class="j"/>

<!-- VIN source (left) -->
<line x1="100" y1="195" x2="175" y2="195"/>
<text x="95" y="191" text-anchor="end" class="net">VIN</text>
<text x="95" y="206" text-anchor="end" class="val">LiPo 2.5–4.2V</text>

<!-- ── C2 22µF (output cap, at x=710) ── -->
<line x1="710" y1="195" x2="710" y2="345"/>
<line x1="685" y1="350" x2="735" y2="350"/>
<line x1="685" y1="361" x2="735" y2="361"/>
<line x1="710" y1="361" x2="710" y2="465"/>
<text x="748" y="350" class="comp">C2</text>
<text x="748" y="365" class="val">22µF X7R</text>
<circle cx="710" cy="195" r="4" class="j"/>

<!-- VOUT label (right) -->
<text x="780" y="189" class="net">VOUT</text>
<text x="780" y="204" class="val">3.3V</text>

<!-- ── Feedback divider: R1 560kΩ + R2 100kΩ ── -->
<circle cx="645" cy="195" r="4" class="j"/>
<line x1="645" y1="195" x2="645" y2="230"/>
<!-- R1 rectangle -->
<rect x="639" y="230" width="12" height="50" class="res"/>
<text x="663" y="250" class="comp">R1</text>
<text x="663" y="265" class="val">560 kΩ</text>
<!-- wire R1-bottom to FB junction -->
<line x1="645" y1="280" x2="645" y2="295"/>
<circle cx="645" cy="295" r="4" class="j"/>
<!-- R2 rectangle -->
<rect x="639" y="295" width="12" height="50" class="res"/>
<text x="663" y="315" class="comp">R2</text>
<text x="663" y="330" class="val">100 kΩ</text>
<!-- wire R2-bottom to GND bus -->
<line x1="645" y1="345" x2="645" y2="465"/>
<circle cx="645" cy="465" r="4" class="j"/>

<!-- ── GND bus ── -->
<line x1="148" y1="465" x2="748" y2="465" class="gbus"/>
<circle cx="175" cy="465" r="4" class="j"/>
<circle cx="415" cy="465" r="4" class="j"/>
<circle cx="710" cy="465" r="4" class="j"/>
<!-- GND symbol -->
<line x1="415" y1="465" x2="415" y2="481"/>
<line x1="399" y1="481" x2="431" y2="481"/>
<line x1="405" y1="489" x2="425" y2="489"/>
<line x1="411" y1="497" x2="419" y2="497"/>
<text x="415" y="514" text-anchor="middle" class="val">GND</text>

<!-- Formula -->
<text x="460" y="534" text-anchor="middle" class="note">VOUT = 0.5V × (1 + R1/R2) = 0.5V × (1 + 560/100) = 3.30V</text>

<!-- ── Separator ── -->
<line x1="40" y1="553" x2="880" y2="553" class="sep"/>
<text x="460" y="568" text-anchor="middle" class="note">▼  VOUT 3.3V from above feeds VIN 3.3V below  ▼</text>

<!-- ================================================================= -->
<!-- SCHEMATIC 2 — TPS63900: 3.3V → 5.0V (SPS30, EN=STM32 PA5)       -->
<!-- ================================================================= -->

<text x="460" y="598" text-anchor="middle" class="title">Schematic 2 — TPS63900: 3.3V → 5.0V  (SPS30, EN = STM32 PA5)</text>

<!-- IC Box -->
<rect x="320" y="695" width="195" height="235" class="ic"/>
<text x="417" y="818" text-anchor="middle" class="comp" font-size="14">TPS63900</text>

<!-- IC pin labels (inside) -->
<text x="328" y="740" class="pin">VIN</text>
<text x="328" y="797" class="pin">EN</text>
<text x="366" y="707" text-anchor="middle" class="pin">L1</text>
<text x="453" y="707" text-anchor="middle" class="pin">L2</text>
<text x="506" y="740" text-anchor="end" class="pin">VOUT</text>
<text x="506" y="845" text-anchor="end" class="pin">FB</text>
<text x="409" y="916" text-anchor="middle" class="pin">GND</text>

<!-- ── Pin stubs ── -->
<!-- VIN: left edge y=735 -->
<line x1="320" y1="735" x2="175" y2="735"/>
<!-- EN: left edge y=791 → to STM32 GPIO (NOT tied to VIN) -->
<line x1="320" y1="791" x2="175" y2="791"/>
<!-- L1: top edge x=370 -->
<line x1="370" y1="695" x2="370" y2="625"/>
<!-- L2: top edge x=453 -->
<line x1="453" y1="695" x2="453" y2="625"/>
<!-- VOUT: right edge y=735 -->
<line x1="515" y1="735" x2="710" y2="735"/>
<!-- FB: right edge y=840 -->
<line x1="515" y1="840" x2="645" y2="840"/>
<!-- GND: bottom edge -->
<line x1="415" y1="930" x2="415" y2="1005"/>

<!-- ── Inductor L 2.2µH ── -->
<path d="M 370,625 A 10,10 0 0 0 390,625 A 10,10 0 0 0 411,625 A 10,10 0 0 0 432,625 A 10,10 0 0 0 453,625"/>
<text x="411" y="597" text-anchor="middle" class="comp">L</text>
<text x="411" y="610" text-anchor="middle" class="val">2.2µH / 1A</text>

<!-- ── C1 10µF ── -->
<line x1="175" y1="735" x2="175" y2="885"/>
<line x1="150" y1="890" x2="200" y2="890"/>
<line x1="150" y1="901" x2="200" y2="901"/>
<line x1="175" y1="901" x2="175" y2="1005"/>
<text x="213" y="890" class="comp">C1</text>
<text x="213" y="905" class="val">10µF X7R</text>
<circle cx="175" cy="735" r="4" class="j"/>

<!-- VIN source (left) -->
<line x1="100" y1="735" x2="175" y2="735"/>
<text x="95" y="731" text-anchor="end" class="net">VIN</text>
<text x="95" y="746" text-anchor="end" class="val">3.3V Rail</text>

<!-- EN → STM32 GPIO PA5 -->
<line x1="100" y1="791" x2="175" y2="791"/>
<text x="95" y="787" text-anchor="end" class="net">PA5</text>
<text x="95" y="802" text-anchor="end" class="val">STM32 GPIO</text>
<text x="95" y="818" text-anchor="end" class="note">HIGH = 5V ON</text>
<text x="95" y="831" text-anchor="end" class="note">LOW  = 5V OFF</text>

<!-- ── C2 100µF ── -->
<line x1="710" y1="735" x2="710" y2="885"/>
<line x1="685" y1="890" x2="735" y2="890"/>
<line x1="685" y1="901" x2="735" y2="901"/>
<line x1="710" y1="901" x2="710" y2="1005"/>
<text x="748" y="890" class="comp">C2</text>
<text x="748" y="905" class="val">100µF ≥6V</text>
<circle cx="710" cy="735" r="4" class="j"/>

<!-- VOUT label (right) -->
<text x="780" y="727" class="net">VOUT</text>
<text x="780" y="742" class="val">5.0V</text>
<text x="780" y="757" class="val">→ SPS30</text>
<text x="780" y="772" class="val">    VDD</text>

<!-- ── Feedback divider: R1 910kΩ + R2 100kΩ ── -->
<circle cx="645" cy="735" r="4" class="j"/>
<line x1="645" y1="735" x2="645" y2="773"/>
<!-- R1 rectangle -->
<rect x="639" y="773" width="12" height="50" class="res"/>
<text x="663" y="793" class="comp">R1</text>
<text x="663" y="808" class="val">910 kΩ</text>
<!-- wire R1-bottom to FB junction -->
<line x1="645" y1="823" x2="645" y2="840"/>
<circle cx="645" cy="840" r="4" class="j"/>
<!-- R2 rectangle -->
<rect x="639" y="840" width="12" height="50" class="res"/>
<text x="663" y="860" class="comp">R2</text>
<text x="663" y="875" class="val">100 kΩ</text>
<!-- wire R2-bottom to GND bus -->
<line x1="645" y1="890" x2="645" y2="1005"/>
<circle cx="645" cy="1005" r="4" class="j"/>

<!-- ── GND bus ── -->
<line x1="148" y1="1005" x2="748" y2="1005" class="gbus"/>
<circle cx="175" cy="1005" r="4" class="j"/>
<circle cx="415" cy="1005" r="4" class="j"/>
<circle cx="710" cy="1005" r="4" class="j"/>
<!-- GND symbol -->
<line x1="415" y1="1005" x2="415" y2="1021"/>
<line x1="399" y1="1021" x2="431" y2="1021"/>
<line x1="405" y1="1029" x2="425" y2="1029"/>
<line x1="411" y1="1037" x2="419" y2="1037"/>
<text x="415" y="1054" text-anchor="middle" class="val">GND</text>

<!-- Formula -->
<text x="460" y="1078" text-anchor="middle" class="note">VOUT = 0.5V × (1 + R1/R2) = 0.5V × (1 + 910/100) = 5.05V</text>

<!-- ── Component legend ── -->
<rect x="40" y="1088" width="840" height="26" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
<text x="460" y="1105" text-anchor="middle" class="note">
  Symbols:  Rectangle = Resistor  |  Two horizontal lines = Capacitor  |  Bumps = Inductor  |  Filled dot = Junction
</text>

</svg>
