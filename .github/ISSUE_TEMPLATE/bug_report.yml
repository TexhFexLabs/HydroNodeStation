name: Bug report
description: Something in the firmware, hardware or documentation does not work as described
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Hardware / PCB
        - Enclosure
        - Payload decoder
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version and build target
      placeholder: "1.6, Release (custom PCB) / Debug (Wio-E5 mini)"
  - type: input
    id: board
    attributes:
      label: Board revision
      placeholder: "Rev A with TPS63900 breakout workaround"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Flash Release target
        2. Pull DEBUG_SW (PB4) high
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: SW-UART output or network server logs
      description: PA6 at 115200 baud, or the uplink frames from your network server.
      render: text
