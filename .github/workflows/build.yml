name: Build
on:
  pull_request:
    branches: [main]
    paths:
      - stm32_node/**
      - doc/payload-decoder.js
      - .github/workflows/build.yml
  push:
    branches: [main, 'feature/**']
    paths:
      - stm32_node/**
      - doc/payload-decoder.js
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 stm32_node/tests/run_tests.py
      - run: node stm32_node/tests/test_decoder.js
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [Release, Debug]
    defaults:
      run:
        working-directory: stm32_node
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.target }}
      - name: Build
        run: cmake --build --preset ${{ matrix.target }}
      - name: Verify disabled CO2 build
        if: matrix.target == 'Release'
        run: |
          cmake -B build/no-co2 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake -DCMAKE_C_FLAGS=-DSCD41_ENABLED=0
          cmake --build build/no-co2
